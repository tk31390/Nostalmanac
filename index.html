<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NOSTALMANAC · v2.1</title>
  <meta name="description" content="NOSTALMANAC v2.1 — 90s cartoons, movies, songs, games, and fads on a CRT. Tap in, scroll, and every slide plays its song.">
  <meta name="theme-color" content="#ff3d00">
  <meta property="og:type" content="website">
  <meta property="og:title" content="NOSTALMANAC — 90s nostalgia on a CRT">
  <meta property="og:description" content="663 slides across cartoons, movies, songs, games, and fads. Every slide plays a real preview — tap in and scroll.">
  <meta property="og:image" content="https://tk31390.github.io/Nostalmanac/assets/og-share.svg">
  <meta property="og:url" content="https://tk31390.github.io/Nostalmanac/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NOSTALMANAC">
  <meta name="twitter:description" content="90s kid almanac on a CRT. Every slide plays its song.">
  <meta name="twitter:image" content="https://tk31390.github.io/Nostalmanac/assets/og-share.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://itunes.apple.com">
  <link rel="preconnect" href="https://en.wikipedia.org">
  <link rel="preconnect" href="https://api.tvmaze.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bangers&family=Outfit:wght@600;800&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=44">
  <link rel="stylesheet" href="css/v1990.css?v=44">
  <link rel="stylesheet" href="css/gameshow.css?v=44">
  <link rel="stylesheet" href="css/a11y.css?v=44">
</head>
<body data-vibe="toon">
  <audio id="bed" playsinline webkit-playsinline loop preload="auto" src="audio/silence.wav"></audio>
  <audio id="logon" playsinline webkit-playsinline preload="auto" src="audio/youve-got-nostalgia.wav"></audio>

  <div id="worlds" aria-hidden="true">
    <div class="world is-on" data-vibe="toon">
      <i class="mag-bg"></i>
      <i class="mag-scrim"></i>
      <i class="mag-gloss"></i>
      <b class="sign">SATURDAY AM ATTACK</b>
    </div>
    <div class="world" data-vibe="movie">
      <i class="mag-bg"></i>
      <i class="mag-scrim"></i>
      <i class="mag-gloss"></i>
      <b class="sign">MULTIPLEX MAYHEM</b>
    </div>
    <div class="world" data-vibe="jam">
      <i class="mag-bg"></i>
      <i class="mag-scrim"></i>
      <i class="mag-gloss"></i>
      <b class="sign">WALKMAN WORSHIP</b>
    </div>
    <div class="world" data-vibe="cart">
      <i class="mag-bg"></i>
      <i class="mag-scrim"></i>
      <i class="mag-gloss"></i>
      <b class="sign">INSERT COIN ZONE</b>
    </div>
    <div class="world" data-vibe="fad">
      <i class="mag-bg"></i>
      <i class="mag-scrim"></i>
      <i class="mag-gloss"></i>
      <b class="sign">LUNCHBOX LEGENDS</b>
    </div>
  </div>

  <div id="fx" aria-hidden="true">
    <i class="fx-scan"></i>
    <i class="fx-rgb"></i>
    <i class="fx-vignette"></i>
    <i class="fx-grain"></i>
    <svg class="fx-snow" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <filter id="snow">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch">
          <animate attributeName="seed" values="0;17;9;28;3;21;0" dur="0.32s" repeatCount="indefinite"/>
        </feTurbulence>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#snow)"/>
    </svg>
    <i class="drip a"></i><i class="drip b"></i><i class="drip c"></i>
    <i class="goo a"></i><i class="goo b"></i><i class="goo c"></i>
  </div>

  <header class="top">
    <span class="brand">
      <strong>NOSTALMANAC</strong>
      <em id="verBadge">v2.1</em>
    </span>
    <span class="top-btns">
      <button type="button" id="btnSearch">Search</button>
      <button type="button" id="btnMute">SOUND ON</button>
    </span>
  </header>

  <main id="stage">
    <div class="masthead">
      <span id="magSection">SATURDAY AM ATTACK</span>
      <span class="masthead-rule" aria-hidden="true"></span>
      <span id="magYear">1990</span>
    </div>
    <div class="crt-console">
      <div class="crt-bezel">
        <div class="crt-screen">
          <figure id="sticker">
            <img id="art" alt="" referrerpolicy="no-referrer">
            <span id="stickerTag">CARTOONS</span>
          </figure>
        </div>
      </div>
    </div>
    <footer class="copy">
      <p id="tag">1990 · CARTOONS</p>
      <h1 id="title">Nostalmanac</h1>
      <p id="note">Tap in and scroll.</p>
      <div class="links">
        <button type="button" id="btnShare" class="linkish">Copy link</button>
        <span id="shareStatus" class="share-status" aria-live="polite"></span>
        <a id="ytLink" href="https://www.youtube.com/" target="_blank" rel="noopener">YouTube</a>
        <a id="wikiLink" href="https://en.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a>
      </div>
      <p id="nowplay"></p>
      <p id="pos">1 / 1</p>
    </footer>
  </main>

  <button type="button" class="hit left" id="prev" aria-label="Previous"></button>
  <button type="button" class="hit right" id="next" aria-label="Next"></button>

  <div id="wipe" aria-hidden="true">
    <canvas id="wipeFx"></canvas>
    <div class="wipe-slime"></div>
    <i class="wipe-burst" aria-hidden="true"></i>
    <div class="scratch-disc"></div>
    <span id="wipeChannel" class="wipe-channel" hidden>CH 07</span>
    <b id="wipeWord">KAPOW!</b>
  </div>

  <div id="connect">
    <canvas id="bootFx"></canvas>
    <div class="wormhole-crt" aria-hidden="true"></div>
    <div class="wormhole-ui">
      <p class="wh-ver">v2.1</p>
      <h1>NOSTALMANAC</h1>
      <p class="wh-cta">TAP IN — EVERY SLIDE PLAYS ITS SONG</p>
      <span id="bootStatus" aria-live="polite"></span>
    </div>
  </div>

  <div id="drawer" hidden inert>
    <div class="sheet">
      <div class="sheet-head">
        <strong>Dig the crates</strong>
        <button type="button" id="btnClose">Done</button>
      </div>
      <input id="search" type="search" placeholder="Sonic, Rugrats, Beastie Boys…" autocomplete="off">
      <label class="verified-toggle"><input type="checkbox" id="verifiedOnly"> Verified previews on this device</label>
      <div class="chips" id="years"></div>
      <div class="chips" id="cats"></div>
      <p class="drawer-count" id="dbCount"></p>
      <ul class="hits" id="results"></ul>
    </div>
  </div>

  <script type="module" src="js/app.js?v=44"></script>
</body>
</html>
