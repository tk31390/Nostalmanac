<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020806"/>
      <stop offset="55%" stop-color="#0a2818"/>
      <stop offset="100%" stop-color="#1a0500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#bg)" opacity="0.9"/>
  <g opacity="0.15" fill="#00ff88" font-family="monospace" font-size="22">
    <text x="40" y="80">ù010N KAPOW 1999 BOOM</text>
    <text x="900" y="120">ZAP 1995 CRT</text>
    <text x="120" y="520">MATRIX WORMHOLE v2.1</text>
  </g>
  <rect x="280" y="95" width="640" height="400" rx="28" fill="#111" stroke="#b6ff00" stroke-width="8"/>
  <rect x="310" y="125" width="580" height="340" rx="8" fill="#0a1a12"/>
  <ellipse cx="600" cy="295" rx="200" ry="160" fill="#00ff8833"/>
  <text x="600" y="270" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="72" fill="#fff" filter="url(#glow)">NOSTALMANAC</text>
  <text x="600" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#b6ff00">663 slides - every one plays its song</text>
  <text x="600" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#ff6a00">Tap in - scroll - nostalgia on a CRT</text>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#ff3d00" stroke-width="12" opacity="0.35"/>
</svg>
